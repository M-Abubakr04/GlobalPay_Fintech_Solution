[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# FastAPI intentionally declares dependency providers in function defaults.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test environment variables must be set before importing the application modules.
"tests/conftest.py" = ["E402"]
