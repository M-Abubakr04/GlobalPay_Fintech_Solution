<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>
<rect width="14" height="900" fill="#1e2761"/>
<text x="55" y="66" font-family="Arial" font-size="34" font-weight="700" fill="#1e2761">Enterprise Network Architecture</text>
<text x="56" y="98" font-family="Arial" font-size="17" fill="#596579">Laptop deployment: zones, exposed ports, protocols and trust boundaries derived from compose.yaml</text>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#596579"/></marker></defs>
<rect x="45" y="130" width="1510" height="130" rx="14" fill="#f3f5f8" stroke="#aab3c2" stroke-width="2"/><text x="65" y="158" font-family="Arial" font-size="17" font-weight="700" fill="#596579">EXTERNAL / HOST ZONE</text>
<rect x="90" y="175" width="260" height="65" rx="12" fill="white" stroke="#a8b0bd" stroke-width="2"/>
<text x="220.0" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">User web browser</text>
<rect x="1240" y="175" width="260" height="65" rx="12" fill="white" stroke="#a8b0bd" stroke-width="2"/>
<text x="1370.0" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Operations browser</text>
<text x="800" y="278" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#596579">HOST FIREWALL / DOCKER PORT-PUBLISHING BOUNDARY</text>
<rect x="45" y="285" width="1510" height="155" rx="14" fill="#fff6dd" stroke="#d4aa35" stroke-width="2"/><text x="65" y="315" font-family="Arial" font-size="17" font-weight="700" fill="#8a6710">EDGE / EXPOSED SERVICES</text>
<rect x="310" y="335" width="330" height="75" rx="12" fill="white" stroke="#d4aa35" stroke-width="2"/>
<text x="475.0" y="365" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Nginx frontend</text>
<text x="326" y="393" font-family="Arial" font-size="15" fill="#172033">host :3000 → container :80</text>
<rect x="960" y="335" width="330" height="75" rx="12" fill="white" stroke="#d4aa35" stroke-width="2"/>
<text x="1125.0" y="365" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Monitoring UI</text>
<text x="976" y="393" font-family="Arial" font-size="15" fill="#172033">Grafana :3001 · Prometheus :9090</text>
<rect x="45" y="465" width="1510" height="155" rx="14" fill="#e7f7f3" stroke="#3b9f8c" stroke-width="2"/><text x="65" y="495" font-family="Arial" font-size="17" font-weight="700" fill="#237667">PRIVATE APPLICATION ZONE · globalpay-net</text>
<rect x="310" y="520" width="330" height="75" rx="12" fill="white" stroke="#3b9f8c" stroke-width="2"/>
<text x="475.0" y="550" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">FastAPI backend</text>
<text x="326" y="578" font-family="Arial" font-size="15" fill="#172033">container :8000 · 9 routers</text>
<rect x="960" y="520" width="330" height="75" rx="12" fill="white" stroke="#3b9f8c" stroke-width="2"/>
<text x="1125.0" y="550" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Metrics endpoint</text>
<text x="976" y="578" font-family="Arial" font-size="15" fill="#172033">Prometheus scrapes /metrics</text>
<rect x="45" y="645" width="1510" height="155" rx="14" fill="#fcebe5" stroke="#d98c72" stroke-width="2"/><text x="65" y="675" font-family="Arial" font-size="17" font-weight="700" fill="#9a513a">PRIVATE DATA ZONE · NOT HOST-EXPOSED</text>
<rect x="245" y="700" width="330" height="75" rx="12" fill="white" stroke="#d98c72" stroke-width="2"/>
<text x="410.0" y="730" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">PostgreSQL 16</text>
<text x="261" y="758" font-family="Arial" font-size="15" fill="#172033">TCP 5432 · authoritative data</text>
<rect x="675" y="700" width="300" height="75" rx="12" fill="white" stroke="#d98c72" stroke-width="2"/>
<text x="825.0" y="730" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Redis 7</text>
<text x="691" y="758" font-family="Arial" font-size="15" fill="#172033">TCP 6379 · cache / rate limit</text>
<rect x="1075" y="700" width="300" height="75" rx="12" fill="white" stroke="#d98c72" stroke-width="2"/>
<text x="1225.0" y="730" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1e2761">Persistent volumes</text>
<text x="1091" y="758" font-family="Arial" font-size="15" fill="#172033">database · model · metrics</text>
<line x1="350" y1="207" x2="475" y2="335" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="412.5" y="263.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">HTTP :3000</text>
<line x1="475" y1="410" x2="475" y2="520" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="475.0" y="457.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">HTTP /api</text>
<line x1="475" y1="595" x2="410" y2="700" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="442.5" y="639.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">SQL/TCP 5432</text>
<line x1="580" y1="595" x2="825" y2="700" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="702.5" y="639.5" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">Redis/TCP 6379</text>
<line x1="1240" y1="207" x2="1125" y2="335" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1182.5" y="263.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">HTTP dashboards</text>
<line x1="1125" y1="520" x2="1125" y2="410" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1125.0" y="457.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">metrics / dashboards</text>
<line x1="960" y1="557" x2="640" y2="557" stroke="#738096" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="800.0" y="549.0" text-anchor="middle" font-family="Arial" font-size="14" fill="#596579">HTTP scrape</text>
<text x="800" y="850" text-anchor="middle" font-family="Arial" font-size="15" fill="#596579">Security boundary: only host-mapped ports are externally reachable; PostgreSQL and Redis remain inside the Docker bridge network.</text>
</svg>