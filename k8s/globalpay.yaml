apiVersion: v1
kind: ConfigMap
metadata:
  name: globalpay-config
  namespace: globalpay
data:
  DATABASE_URL: postgresql+psycopg://globalpay:globalpay@postgres:5432/globalpay
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: globalpay
spec:
  replicas: 1
  selector:
    matchLabels: { app: globalpay-backend }
  template:
    metadata:
      labels: { app: globalpay-backend }
    spec:
      containers:
        - name: backend
          image: globalpay-backend:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: globalpay-config }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: globalpay
spec:
  selector: { app: globalpay-backend }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: globalpay
spec:
  replicas: 1
  selector:
    matchLabels: { app: globalpay-frontend }
  template:
    metadata:
      labels: { app: globalpay-frontend }
    spec:
      containers:
        - name: frontend
          image: globalpay-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: globalpay
spec:
  type: NodePort
  selector: { app: globalpay-frontend }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
